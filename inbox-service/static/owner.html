<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Website inbox — Raj Industries</title><link rel="stylesheet" href="/inbox.css"><script type="module" src="/owner.js"></script></head><body>
<main class="shell"><header><p class="eyebrow">Raj Industries / Owner</p><h1>Website inbox</h1><p id="identity"></p><p id="accessStatus" role="status">Checking access…</p><a id="signIn" class="button" href="/signin-with-chatgpt?return_to=%2Fowner" hidden>Sign in with ChatGPT</a></header>
