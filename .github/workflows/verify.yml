name: Verify preview
on:
  pull_request:
    branches: [main]
  push:
    branches: ["design/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify page boundaries and conversation behavior
        run: node --test site.test.mjs public-status.test.mjs project-assistant.test.mjs
